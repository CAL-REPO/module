# =============================================================================
# 운영 환경용 설정 (안정성 최우선)
# =============================================================================
# 실제 운영 서버에서 사용
# 백업 생성, 재시도 로직, 안전한 저장 전략

xw_app:
  visible: false             # 백그라운드 실행
  add_book: false
  display_alerts: false
  screen_updating: true      # 중간 정도 성능

performance:
  screen_updating: true      # 적당한 속도 유지
  display_alerts: false
  calculation: "auto"        # 자동 계산 (정확성)
  enable_events: true
  interactive: false
  clear_clipboard: true

save:
  strategy: "on_exit"        # 종료 시 안전하게 저장

error_handling:
  on_file_not_found: "error" # 엄격한 에러 처리
  on_sheet_not_found: "error"
  on_save_error:
    action: "retry"          # 저장 실패 시 재시도 (중요!)
    retry_count: 5           # 5번 재시도
    retry_delay: 2.0         # 2초 대기

path_validation:
  fso:
    as_type: "file"
    exist:
      must_exist: true       # 파일 반드시 존재
      create_if_missing: false
      overwrite: false
  template_path: null
  backup_if_exists: true     # 백업 생성 (중요!)

log:
  enabled: true
  name: "xl_utils"
  level: "INFO"              # 일반 정보 로그
  sinks:
    - sink_type: "console"
      level: "INFO"
    - sink_type: "file"      # 파일로도 저장
      file_path: "logs/xl_utils_production.log"
      level: "INFO"
      rotation: "50 MB"
      retention: "30 days"
  context: {}

