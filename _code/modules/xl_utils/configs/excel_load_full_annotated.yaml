# =============================================================================
# 런타임 오버라이드
# =============================================================================
# Python 코드에서 동적으로 정책 변경 가능:
#
# excel_load = ExcelLoad(
#     "config.yaml",
#     save__strategy="manual",              # save.strategy 오버라이드
#     performance__screen_updating=False,    # performance.screen_updating 오버라이드
#     log__level="DEBUG"                     # log.level 오버라이드
# )
#
# 네이밍 규칙: {section}__{key} (double underscore)
# =============================================================================
