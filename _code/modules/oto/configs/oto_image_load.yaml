# ============================================================================
# ImageLoader - OTO Configuration
# ============================================================================
# OTO 파이프라인에서 사용하는 ImageLoad Adapter 설정
# 필수 항목만 활성화, 고급 옵션은 주석 처리

# --------------------------------------------------------------------------
# 1. Image - ImageLoad Adapter 설정
# --------------------------------------------------------------------------
image_load:
  # Save - 이미지 저장 설정
  save:
    save_copy: true                    # 이미지 복사본 저장 여부 (임시로 비활성화)
    directory: "{{modules_dir}}/oto/test/images"      # 저장 디렉토리
    
    # FSO Name Policy - 파일 이름 생성 정책
    name:
      # as_type: "file"
      # prefix: null
      # name: ""
      suffix: "copy"              # 파일명 접미사
      # tail: null
      extension: ".jpg"           # 파일 확장자 (원본 유지하려면 주석 처리)
      
      # Tail 자동 생성 옵션
      delimiter: "_"
      tail_mode: "counter_datetime"         # ensure_unique와 함께 사용
      date_format: "%Y-%m-%d"
      counter_width: 2
      # auto_expand: true
      # tail_suffix: null
      # sanitize: true
      # case: "keep"
      # ensure_unique: true
    # ops:
    #   as_type: "file"
    #   exist:
    #     must_exist: false
    #     create_if_missing: true
    #     overwrite: false
      # ext:
      #   require_ext: true
      #   default_ext: null
      #   allowed_exts: null
    
    # 이미지 포맷 설정
    # format: null
    quality: 95                         # JPEG/WebP 품질
  
  # Meta - 메타데이터 저장 설정
  meta:
    save_meta: true                    # 메타 저장 활성화
    directory: "{{modules_dir}}/oto/test/images"      # 메타 저장 디렉토리
    name:
    #   as_type: "file"
    #   prefix: null
    #   name: ""
      suffix: "image_meta"
    #   tail: null
    #   extension: ".json"
      delimiter: "_"
      tail_mode: "counter_datetime"
      date_format: "%Y-%m-%d"
      counter_width: 2
    #   auto_expand: true
    #   tail_suffix: null
    #   sanitize: true
    #   case: "keep"
    #   ensure_unique: false
    ops:
      as_type: "file"
      exist:
        must_exist: false
        create_if_missing: true
        overwrite: true
      # ext:
      #   require_ext: true
      #   default_ext: ".json"
      #   allowed_exts: null
  
  # Process - 이미지 처리 설정
  # process:
  #   resize_to: null
  #   blur_radius: null
  #   convert_mode: null
  
  # Log - ImageLoad Adapter 전용 로그 (Dual Logging - Secondary)
  log:
    enabled: true
    name: "log_oto_image_load"
    level: "DEBUG"
    sinks:
      - sink_type: "file"
        file_path: "{{modules_dir}}/oto/test/logs/log_oto_image_load_{time:YYYY-MM-DD}.log"
        level: "DEBUG"
        format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
        rotation: "10 MB"
        retention: "7 days"
        compression: null
        enqueue: true
        serialize: false
        backtrace: true
        diagnose: true
        colorize: true
        catch: true