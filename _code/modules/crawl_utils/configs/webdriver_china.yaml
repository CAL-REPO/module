# -*- coding: utf-8 -*-
# 중국 지역 WebDriver 설정
# 지원 브라우저: Firefox (Chrome 향후 추가 가능)
# 적용 사이트: taobao, tmall, 1688, jd, vvic

webdriver_china:
  # -------------------------------------------------------------------------
  # 공통 설정 (모든 브라우저)
  # -------------------------------------------------------------------------
  provider: "firefox"  # firefox, chrome, edge
  region: "china"
  
  headless: false
  window_size: [1920, 1080]
  
  # -------------------------------------------------------------------------
  # Accept-Language (지역별 고정값)
  # -------------------------------------------------------------------------
  accept_languages: "zh-CN,zh;q=0.9,en-US;q=0.8,en;q=0.7"
  
  # -------------------------------------------------------------------------
  # User-Agent (browser_versions.json에서 런타임 주입)
  # ⚠️  자주 변경되므로 JSON 파일에서 관리!
  # -------------------------------------------------------------------------
  # user_agent: ""  # 런타임에 get_user_agent() 사용
  
  # -------------------------------------------------------------------------
  # 자동화 탐지 회피
  # -------------------------------------------------------------------------
  disable_automation: true
  
  # -------------------------------------------------------------------------
  # Firefox 전용 설정
  # -------------------------------------------------------------------------
  firefox:
    binary_path: "C:/Program Files/Mozilla Firefox/firefox.exe"
    profile_path: "M:/Firefox_Profile/CRAWL_CHINA"
    driver_path: "M:/WebDriver/geckodriver_win32.exe"
    use_webdriver_manager: true
    
    # Firefox preferences
    dom_enabled: false
    resist_fingerprint_enabled: false
    
    # 추가 옵션
    enable_cookies: true
    enable_cache: true
    load_images: true
    enable_javascript: true
  
  # -------------------------------------------------------------------------
  # Chrome 전용 설정 (향후 사용)
  # -------------------------------------------------------------------------
  # chrome:
  #   binary_path: "C:/Program Files/Google/Chrome/Application/chrome.exe"
  #   user_data_dir: "M:/Chrome_Profile/China"
  #   driver_path: "M:/WebDriver/chromedriver.exe"
  #   disable_extensions: true
  #   disable_gpu: false
