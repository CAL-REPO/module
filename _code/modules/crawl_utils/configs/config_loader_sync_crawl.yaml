# ============================================================
# ConfigLoader for SyncCrawl Adapter (OTO Pattern)
# ============================================================
# 목적: SyncCrawl Adapter 통합 테스트용 ConfigLoader 설정
# 대상: SyncCrawlPolicy (webdriver_manager + crawl + log 통합)
# 네이밍 규칙: config_loader_sync_crawl.yaml

source:
  # 1. WebDriver Manager Policy
  - src: ["{{modules_dir}}/crawl_utils/configs/webdriver_manager.yaml", "webdriver_manager"]
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: true              # ✅ 환경변수 resolving 필수!
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: false
      resolve_vars: true
    
    yaml_merge:
      deep: true
      overwrite: true
    
    # BaseModel 정책
    base_model_normalizer:
      normalize_keys: true
      drop_blanks: false
      resolve_vars: false
    
    base_model_merge:
      deep: false
      overwrite: false
    
    # Dict 정책
    dict_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: false
    
    dict_merge:
      deep: false
      overwrite: true
  
  # 2. Crawl Policy (Fallback)
  - src: ["{{modules_dir}}/crawl_utils/configs/sync_crawl.yaml", "crawl"]
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: true
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: false
      resolve_vars: true
    
    yaml_merge:
      deep: true
      overwrite: true
    
    base_model_normalizer:
      normalize_keys: true
      drop_blanks: false
      resolve_vars: false
    
    base_model_merge:
      deep: false
      overwrite: false
    
    dict_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: false
    
    dict_merge:
      deep: false
      overwrite: true
  
  # 3. Log Policy (선택적) - default_log 섹션을 log로 매핑
  - src:
      - "{{modules_dir}}/logs_utils/configs/log.yaml"
      - "default_log"  # Source section
    target_section: "log"  # Target section name
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: true
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: false
      resolve_vars: true
    
    yaml_merge:
      deep: true
      overwrite: true
    
    base_model_normalizer:
      normalize_keys: true
      drop_blanks: false
      resolve_vars: false
    
    base_model_merge:
      deep: false
      overwrite: false
    
    dict_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: false
    
    dict_merge:
      deep: false
      overwrite: true

keypath:
  separator: "__"

# --------------------------------------------------------------------------
# Log - ConfigLoader 자체 로그 설정
# --------------------------------------------------------------------------
log:
  enabled: true
  name: config_loader_sync_crawl
  level: DEBUG
  sinks:
    - sink_type: console
      level: DEBUG
      format: "<green>{time:YYYY-MM-DD HH:mm:ss.SSS}</green> | <level>{level: <8}</level> | <level>{message}</level>"
      colorize: true
      enqueue: true
  context: {}
