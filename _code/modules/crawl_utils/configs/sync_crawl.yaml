# -*- coding: utf-8 -*-
# sync_crawl.yaml
# SyncCrawl 기본 설정 (Preset이 이 값을 override함)
# 
# 역할:
# 1. Preset이 없을 때 Fallback으로 사용
# 2. Preset이 있어도 기본값 제공 (Preset은 필요한 부분만 override)
# 
# 주의: WebDriver 설정은 webdriver_manager.yaml 참조!

# =============================================================================
# Crawl Policy - 크롤링 동작 설정 (Preset 없을 때 Fallback)
# =============================================================================
crawl:
  # Config section name (필수)
  name: "crawl"
  
  # Site/Method (PresetManager가 자동 설정, 수동 지정 가능)
  site: ""  # PresetManager.analyze_url() 결과
  method: ""  # PresetManager.analyze_url() 결과
  
  # ============================================================================
  # Navigation Policy (Optional - search 메서드에서만 사용)
  # ============================================================================
  # Detail 크롤링에서는 불필요 (주석 처리)
  # navigation:
  #   base_url: "https://www.aliexpress.com/w/wholesale-shoes.html"
  #   url_template: "https://www.aliexpress.com/w/wholesale-{query}.html?page={page}"
  #   params:
  #     query: "shoes"
  #   page_param: "page"
  #   start_page: 1
  #   max_pages: 5
  
  # ============================================================================
  # Scroll Policy - 페이지 스크롤 설정
  # ============================================================================
  scroll:
    strategy: "infinite"  # "none", "infinite", "fixed"
    scroll_count: null  # fixed 전략일 때 사용 (site-specific)
    max_scrolls: 10  # infinite 전략의 최대 스크롤 횟수
    scroll_pause_sec: 1.0  # 스크롤 간 대기 시간 (초)
  
  # ============================================================================
  # Wait Policy - 요소 대기 설정
  # ============================================================================
  wait:
    hook: "css"  # "css", "xpath", "sleep"
    selector: "body"  # CSS 또는 XPath 선택자
    timeout_sec: 10.0  # 최대 대기 시간 (초)
    condition: "presence"  # "presence", "visibility"
  
  # ============================================================================
  # Extractor Policy - 데이터 추출 설정
  # ============================================================================
  extractor:
    type: "js"  # "dom", "js", "api"
    
    # DOM Extractor 설정 (type: "dom"일 때)
    item_selector: null  # CSS/XPath selector
    
    # JS Extractor 설정 (type: "js"일 때) - 기본 범용 추출
    js_snippet: |
      // 범용 데이터 추출 (Preset 없을 때 기본값)
      return {
        title: document.querySelector('h1')?.innerText?.trim() || 
               document.querySelector('title')?.innerText?.trim() || '',
        images: Array.from(document.querySelectorAll('img'))
          .map(img => img.src || img.getAttribute('data-src'))
          .filter(src => src && src.startsWith('http')),
        price: document.querySelector('[class*="price"]')?.innerText?.trim() || '',
        description: document.querySelector('[class*="description"]')?.innerText?.trim()?.slice(0, 200) || ''
      };
    
    # API Extractor 설정 (type: "api"일 때)
    api_endpoint: null
    api_method: "GET"
    payload: null
  
  # ============================================================================
  # PostProcessor Policy - 후처리 설정 (KeyPath + FSO)
  # ============================================================================
  post_processor:
    target_dir: "{{output_dir}}/crawl/default"
    use_smart_normalizer: true
    rules:
      # 이미지 저장 규칙
      - kind: "image"
        source: "images"  # KeyPath (추출 데이터의 필드명)
        allow_empty: false
        dynamic_subdir: "{{cas_no}}/images"
        fso_name_policy:
          prefix: "IMG"
          tail_mode: "counter"
          counter_width: 3
          extension: "jpg"
          sanitize: true
          ensure_unique: true
        fso_ops_policy:
          as_type: "file"
          exist:
            must_exist: false
            create_if_missing: true
            overwrite: false
      
      # 텍스트 저장 규칙
      - kind: "text"
        source: "title"
        allow_empty: false
        dynamic_subdir: "{{cas_no}}/metadata"
        fso_name_policy:
          name: "title"
          extension: "txt"
          sanitize: true
        fso_ops_policy:
          as_type: "file"
          exist:
            create_if_missing: true
      
      # JSON 저장 규칙
      - kind: "json"
        source: "."  # 전체 데이터
        allow_empty: false
        dynamic_subdir: "{{cas_no}}/metadata"
        fso_name_policy:
          name: "data"
          extension: "json"
        fso_ops_policy:
          as_type: "file"
          exist:
            create_if_missing: true
  
  # ============================================================================
  # HTTP Session Policy - HTTP 세션 설정
  # ============================================================================
  http_session:
    use_browser_headers: true
    headers:
      Accept-Language: "en-US,en;q=0.9,ko;q=0.8"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
  
  # ============================================================================
  # Execution Settings - 실행 설정
  # ============================================================================
  execution_mode: "sync"  # "sync", "async"
  concurrency: 1  # async 모드에서만 사용
  
  # Retry settings
  retries: 3
  retry_backoff_sec: 2.0
  
  # ============================================================================
  # Log Policy - 로깅 설정
  # ============================================================================
  log:
    enabled: true
    log_level: "INFO"  # "DEBUG", "INFO", "WARNING", "ERROR"
    log_to_file: false
    log_file_path: null
    log_format: "<green>{time:YYYY-MM-DD HH:mm:ss.SSS}</green> | <level>{level: <8}</level> | <level>{message}</level>"
