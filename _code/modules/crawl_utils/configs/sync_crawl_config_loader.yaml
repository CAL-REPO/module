# ============================================================
# ConfigLoader for SyncCrawl Adapter (OTO Pattern)
# ============================================================
# 목적: SyncCrawl Adapter 통합 테스트용 ConfigLoader 설정
# 대상: SyncCrawlPolicy (webdriver_manager + crawl + log 통합)
# 네이밍 규칙: config_loader_sync_crawl.yaml

source:
  # 1. WebDriver Manager Policy
  - src: ["{{modules_dir}}/crawl_utils/configs/webdriver_manager.yaml", "webdriver_manager"]
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: true              # ✅ 환경변수 resolving 필수!
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: true
    yaml_merge:
      deep: true
      overwrite: true
  
  # 2. Crawl Policy (Fallback)
  - src: ["{{modules_dir}}/crawl_utils/configs/sync_crawl.yaml", "sync_crawl"]
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: true
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: true
    yaml_merge:
      deep: true
      overwrite: true

keypath:
  separator: "__"

# --------------------------------------------------------------------------
# Log - ConfigLoader 자체 로그 설정
# --------------------------------------------------------------------------
log:
  enabled: true
  name: "log_sync_crawl_cfg_loader"
  level: DEBUG
  sinks:
    - sink_type: console
      level: DEBUG
      format: "<green>{time:YYYY-MM-DD HH:mm:ss.SSS}</green> | <level>{level: <8}</level> | <level>{message}</level>"
      colorize: true
      enqueue: true
  context: {}
