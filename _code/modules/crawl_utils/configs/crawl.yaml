# -*- coding: utf-8 -*-
# =============================================================================
# URL Patterns (UrlAnalyzer 설정)
# =============================================================================
url_patterns:
  # Site 도메인 매핑
  site_domains:
    aliexpress:
      - "aliexpress.com"
      - "aliexpress.us"
      - "aliexpress.ru"
    
    taobao:
      - "taobao.com"
      - "world.taobao.com"
      - "item.taobao.com"
    
    1688:
      - "1688.com"
      - "detail.1688.com"
  
  # Method 패턴 매핑 (경로 기반)
  method_patterns:
    product_detail:
      - "/item/"           # AliExpress: /item/123.html
      - "item.htm"         # Taobao: item.taobao.com/item.htm?id=123
      - "/product/"        # Alternative pattern
      - "detail.html"      # Alternative pattern
    
    product_search:
      - "/wholesale"       # AliExpress: /wholesale?SearchText=...
      - "/search"          # Taobao: s.taobao.com/search?q=...
      - "/category"        # Category pages
      - "s.taobao.com"     # Taobao search domain