# crawl_utils base configuration
# URL 패턴 및 크롤링 기본 설정

# =============================================================================
# URL Patterns (UrlAnalyzer 설정)
# =============================================================================
url_patterns:
  # Site 도메인 매핑
  site_domains:
    aliexpress:
      - "aliexpress.com"
      - "aliexpress.us"
      - "aliexpress.ru"
    
    taobao:
      - "taobao.com"
      - "world.taobao.com"
      - "item.taobao.com"
    
    1688:
      - "1688.com"
      - "detail.1688.com"
  
  # Method 패턴 매핑 (경로 기반)
  method_patterns:
    product_detail:
      - "/item/"           # AliExpress: /item/123.html
      - "item.htm"         # Taobao: item.taobao.com/item.htm?id=123
      - "/product/"        # Alternative pattern
      - "detail.html"      # Alternative pattern
    
    product_search:
      - "/wholesale"       # AliExpress: /wholesale?SearchText=...
      - "/search"          # Taobao: s.taobao.com/search?q=...
      - "/category"        # Category pages
      - "s.taobao.com"     # Taobao search domain

# =============================================================================
# Source (URL 소스 설정)
# =============================================================================
source:
  urls: []  # 스크립트에서 동적으로 전달
  method: "product_detail"  # "product_detail" | "product_search"

# =============================================================================
# Site/Method (URL 분석으로 자동 결정)
# =============================================================================
site: ""    # "aliexpress", "taobao", "1688" (auto-detected)
method: ""  # "product_detail", "product_search" (from source.method)

# =============================================================================
# Navigation (페이지 네비게이션 설정)
# =============================================================================
navigation:
  base_url: "https://www.aliexpress.com"
  page_param: "page"
  start_page: 1
  max_pages: 1

# =============================================================================
# Scroll (스크롤 설정)
# =============================================================================
scroll:
  enabled: false
  strategy: "smooth"
  max_scrolls: 10
  pause_sec: 1.0

# =============================================================================
# Extractor (데이터 추출 설정)
# =============================================================================
extractor:
  method: "js"
  js_snippet: |
    return {
      images: [...document.querySelectorAll('img')].map(img => img.src),
      title: document.querySelector('h1')?.textContent || '',
      price: document.querySelector('.price')?.textContent || ''
    };

# =============================================================================
# Wait (대기 설정)
# =============================================================================
wait:
  timeout_sec: 10.0
  page_load_timeout_sec: 30.0
  implicit_wait_sec: 0.0

# =============================================================================
# HTTP Session (세션 설정)
# =============================================================================
http_session:
  enabled: false
  session_path: ""

# =============================================================================
# Execution (실행 설정)
# =============================================================================
execution_mode: "async"  # "async" | "sync"
concurrency: 2
retries: 2
retry_backoff_sec: 1.0

# =============================================================================
# Normalization (정규화 설정) - Optional
# =============================================================================
normalization:
  enabled: false
  rules: []

# =============================================================================
# Log (로깅 설정) - Optional
# =============================================================================
log:
  enabled: true
  log_level: "INFO"
  log_file: null
