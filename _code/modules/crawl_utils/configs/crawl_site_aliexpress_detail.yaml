# -*- coding: utf-8 -*-
# AliExpress 상세 페이지 - 모든 이미지와 텍스트 추출

crawl:
  site: "aliexpress"
  method: "product_detail"

  http_session:
    use_browser_headers: true
    headers:
      Accept-Language: "en-US,en;q=0.9,ko;q=0.8"
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

  concurrency: 1
  retries: 3
  retry_backoff_sec: 2.0

  navigation:
    base_url: "https://www.aliexpress.com/item"
    url_template: "{url}"  # 검색에서 얻은 URL 사용

  scroll:
    strategy: "fixed"
    scroll_count: 15
    scroll_pause_sec: 1.0

  wait:
    hook: "css"
    selector: "[class*='product'], .product-main"
    timeout_sec: 25.0
    condition: "visibility"

  extractor:
    type: "js"
    js_snippet: |
      const items = [];
      document.querySelectorAll('.result-item img').forEach((img) => {
        let url = img.getAttribute('data-src') || img.getAttribute('src') || '';
        if (url.startsWith('//')) url = 'https:' + url;
        if (/^https?:\/\//i.test(url)) {
          items.push({ url, caption: img.getAttribute('alt') || '' });
        }
      });
      return items;
  
