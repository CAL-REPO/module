# -*- coding: utf-8 -*-
# crawl_utils/configs/sync_crawl_full.yaml
# SyncCrawl full configuration covering all policies consumed by sync_crawl.py

sync_crawl:
  # name: "sync_crawl"
  # ---------------------------------------------------------------------------
  # CrawlPolicy (navigation, scroll, wait, extractor, rules, post_processor…)
  # ---------------------------------------------------------------------------
    # site: ""      # analyze_url() fills site/method at runtime
    # method: ""    # analyze_url() fills site/method at runtime

  # ✅ 새로 추가 (WebDriver 이후 실행 계층)
  # ✅ 필요할 때만 넣기 (전부 Optional)
  session_bridge:
    user_agent: null
    proxy: null

  http_session:
    reuse: true
    timeout_connect_sec: 8.0
    timeout_read_sec: 45.0
    allow_redirects: true
    stream_download: true

  cookie_bridge:
    cookie_sync_domains: []   # 비워두면 lazy-sync만

  retry:
    max_attempts: 3
    backoff_base_ms: 200
    backoff_factor: 2.0
    jitter_ms: 100
    retry_status_codes: [500, 502, 503, 504]
    retry_on_auth_like: true

  navigation: 
    base_url: null
    url_template: null
    params: {}
    page_param: "page"
    start_page: 1
    max_pages: 1

  scroll: 
    strategy: null  # null | none | step | paginate | infinite (Preset에서 설정)
    scroll_count: null
    max_scrolls: null
    scroll_step_px: null
    scroll_pause_sec: null

  wait: 
    hook: null      # null | none | css | xpath (Preset에서 설정)
    selector: null
    timeout_sec: null
    condition: null  # null | presence | visibility (Preset에서 설정)

  extractor:
    type: "js"
    item_selector: null
    js_snippet: |
      return [{
        title: document.querySelector('.product-title')?.textContent?.trim() || '',
        price: document.querySelector('.product-price')?.textContent?.trim() || '',
        images: Array.from(document.querySelectorAll('.product-image img')).map(img => img.src),
        description: document.querySelector('#product-description')?.innerText?.trim() || ''
      }];
    js_snippet_file: null
    api_endpoint: null
    api_method: "GET"
    payload: null

  items:
    - kind: null
      source: ""
      dir_path: ""
      fso_name:
        as_type: ""
        prefix: null
        name: ""
        suffix: ""
        tail: null
        extension: ""
        delimiter: "_"
        tail_mode: null
        date_format: "%Y-%m-%d"
        counter_width: 3
        auto_expand: true
        tail_suffix: null
        sanitize: true
        case: null
        ensure_unique: false
      fso_ops:
        as_type: null
        exist:
          must_exist: null
          create_if_missing: null
          overwrite: null
        ext:
          require_ext: null
          default_ext: null
          allowed_exts: null

    - kind: ""
      source: ""
      dir_path: ""
      fso_name:
        as_type: ""
        prefix: null
        name: ""
        suffix: ""
        tail: null
        extension: ""
        delimiter: "_"
        tail_mode: null
        date_format: "%Y-%m-%d"
        counter_width: 3
        auto_expand: true
        tail_suffix: null
        sanitize: true
        case: "keep"
        ensure_unique: false
      fso_ops:
        as_type: ""
        exist:
          must_exist: false
          create_if_missing: true
          overwrite: true
        ext:
          require_ext: false
          default_ext: ""
          allowed_exts: null

  log:
    enabled: true
    name: "crawl_policy"
    level: "INFO"
    sinks:
      - sink_type: "console"
        level: "INFO"
        format: "<green>{time:HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan> - <level>{message}</level>"
        enqueue: true
        serialize: false
        backtrace: true
        diagnose: true
        colorize: true
        catch: true
      - sink_type: "file"
        file_path: "{{env.output_dir}}/logs/sync_crawl_policy_{time:YYYY-MM-DD}.log"
        level: "DEBUG"
        format: "<green>{time:YYYY-MM-DD HH:mm:ss.SSS}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
        rotation: "10 MB"
        retention: "7 days"
        compression: null
        enqueue: true
        serialize: false
        backtrace: true
        diagnose: true
        colorize: false
        catch: true
    context:
      module: "crawl_policy"
      preset: "{{runtime.preset|default('')}}"
