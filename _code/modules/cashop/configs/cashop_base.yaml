# ============================================================
# CashopBasePolicy - Cashop 파이프라인 공통 정책
# ============================================================
# xloto/xlcrawl 파이프라인 공통 정책 (로깅 + 경로)
# 서브 모듈 정책은 SectionExtractor가 동적 추출
# ⚠️ Excel 파일 경로는 ExcelLoadPolicy.files에서 관리

# ============================================================
# xloto Section (SectionExtractor에서 사용)
# ============================================================
cashop_base:
  
  # ============================================================
  # Paths Policy - 이미지 경로 정책
  # ============================================================
  paths:
    # 공용 이미지 디렉토리 (환경변수 참조)
    public_img_dir: "{{cashop_test_dir}}/images"
    # 원본 이미지 폴더명
    origin_dirname: "input"
    # 번역 이미지 폴더명
    translated_dirname: "output"
    # xlcrawl 전용 (xloto에서는 사용 안 함, 기본값)
    output_dir: "output/crawl"

  # ============================================================
  # Log Policy - XLOTO 파이프라인 로깅 정책
  # ============================================================
  log:
    # 로깅 활성화
    enabled: false
    
    # Logger 이름
    name: "log_cashop_xloto_pipeline"
    
    # 로그 레벨 (DEBUG, INFO, WARNING, ERROR, CRITICAL)
    level: "INFO"
    
    # Sinks 설정
    sinks:
      # Console Sink
      - sink_type: "console"
        level: "INFO"
        format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan> - <level>{message}</level>"
        colorize: true
        enqueue: false
        catch: true
      
      # File Sink (Debug)
      - sink_type: "file"
        file_path: "{{cashop_test_dir}}/logs/xloto_pipeline_{time:YYYY-MM-DD}.log"
        level: "DEBUG"
        format: "<green>{time:YYYY-MM-DD HH:mm:ss.SSS}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
        rotation: "10 MB"
        retention: "30 days"
        compression: null
        enqueue: true
        serialize: false
        backtrace: true
        diagnose: true
        colorize: true
        catch: true
      
      # File Sink (Error Only)
      - sink_type: "file"
        file_path: "{{modules_dir}}/xl/xloto/test/logs/xloto_error_{time:YYYY-MM-DD}.log"
        level: "ERROR"
        format: "<red>{time:YYYY-MM-DD HH:mm:ss.SSS}</red> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>\n{exception}"
        rotation: "10 MB"
        retention: "90 days"
        compression: "zip"
        enqueue: true
        serialize: false
        backtrace: true
        diagnose: true
        colorize: true
        catch: true
    
    # Context (추가 로그 컨텍스트)
    context:
      pipeline: "xloto"
      version: "1.0.0"