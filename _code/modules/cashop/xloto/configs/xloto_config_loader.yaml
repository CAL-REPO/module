# ============================================================
# ConfigLoaderPolicy - XLOTO Configuration
# ============================================================
# XLOTO Adapter용 설정 로더
# scripts/xloto/configs 폴더의 YAML 파일들을 병합하여 XlOtoPolicy 생성

source:

  # xloto 섹션 (XLOTO Policy - Excel 설정 + Paths + Log)
  - src: ["{{cashop_base_config}}", "cashop_base"]
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: true
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: true
    yaml_merge:
      deep: true
      overwrite: true

  # excel 섹션 (Adapter Policy 섹션명)
  - src: ["{{cashop_configs_dir}}/cashop_excel.yaml", "excel_load"]
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: true
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: true
    yaml_merge:
      deep: true
      overwrite: true

  # image_load 섹션 (Adapter Policy 섹션명)
  - src: ["{{cashop_xloto_configs_dir}}/xloto_image_load.yaml", "image_load"]
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: true
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: true
    yaml_merge:
      deep: true
      overwrite: true

  # image_text_recognize 섹션 (Adapter Policy 섹션명)
  - src: ["{{cashop_xloto_configs_dir}}/xloto_image_text_recognize.yaml", "image_text_recognize"]
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: true
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: true
    yaml_merge:
      deep: true
      overwrite: true

  # translate 섹션 (Adapter Policy 섹션명)
  - src: ["{{cashop_xloto_configs_dir}}/xloto_translate.yaml", "translate"]
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: true
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: true
    yaml_merge:
      deep: true
      overwrite: true

  # image_overlay 섹션 (Adapter Policy 섹션명)
  - src: ["{{cashop_xloto_configs_dir}}/xloto_image_overlay.yaml", "image_overlay"]
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: true
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: true
    yaml_merge:
      deep: true
      overwrite: true

keypath:
separator: "__"

log:
  enabled: false
  name: "log_xloto_cfg_loader"
  level: "INFO"
  sinks:
    - sink_type: "file"
      file_path: "{{cashop_test_dir}}/logs/log_xloto_config_loader_{time:YYYY-MM-DD}.log"
      level: "DEBUG"
      format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
      rotation: "10 MB"
      retention: "7 days"
      compression: null
      enqueue: true
      serialize: false
      backtrace: true
      diagnose: true
      colorize: true
      catch: true
  context: {}

