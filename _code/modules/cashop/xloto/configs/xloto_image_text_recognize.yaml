# ============================================================================
# ImageTextRecognize - OTO Adapter Configuration
# ============================================================================
# OTO 파이프라인에서 사용하는 ImageTextRecognize Adapter 설정
# Adapter 패턴: 순수 로직 + save + meta (모든 기능)

image_text_recognize:
  # --------------------------------------------------------------------------
  # 1. Provider - OCR 제공자 설정
  # --------------------------------------------------------------------------
  provider:
    provider: "paddle"                  # OCR 제공자: paddle, tesseract
    langs: ["ch", "en"]                 # 언어 코드 목록
    min_conf: 0.5                       # 최소 신뢰도 (0.0-1.0)
    
    # PaddleOCR 전용 설정
    paddle_device: "gpu"
    paddle_use_angle_cls: true
    paddle_use_doc_orientation_classify: false  # 🔧 문서 방향 감지 비활성화
    paddle_use_doc_unwarping: false             # 🔧 문서 왜곡 보정 비활성화
  
  # --------------------------------------------------------------------------
  # 2. Preprocess - OCR 전처리 설정
  # --------------------------------------------------------------------------
  preprocess:
    max_width: 2000                     # 최대 너비 (이보다 크면 resize)
  
  # --------------------------------------------------------------------------
  # 3. Postprocess - OCR 후처리 설정
  # --------------------------------------------------------------------------
  postprocess:
    strip_special_chars: true           # 특수문자 제거
    filter_alphanumeric: true           # 영숫자만 있는 텍스트 필터링
    deduplicate_iou_threshold: 0.7      # 중복 제거 IoU 임계값
    prefer_lang_order: ["ch", "en"]     # 언어 우선순위
  
  # --------------------------------------------------------------------------
  # 4. Save - 이미지 저장 정책
  # --------------------------------------------------------------------------
  save:
    save_copy: false
    directory: "{{cashop_test_dir}}/images"  # null이면 downloads()
    name:
      as_type: file
      suffix: "text_recognize"
      extension: ".jpg"           # 파일 확장자
      tail_mode: counter
      ensure_unique: true
    ops:
      as_type: file
      exist:
        create_if_missing: true
    format: null
    quality: 95

  # --------------------------------------------------------------------------
  # 5. Meta - 메타데이터 저장 정책
  # --------------------------------------------------------------------------
  meta:
    save_meta: false
    directory: "{{cashop_test_dir}}/images"
    name:
      as_type: file
      suffix: "text_recognize_meta"
      extension: .json
      ensure_unique: false
    ops:
      as_type: file
      exist:
        create_if_missing: true
        overwrite: true
      ext:
        default_ext: .json

  # --------------------------------------------------------------------------
  # 6. Log - 로그 설정 (Dual Logging - Secondary)
  # --------------------------------------------------------------------------
  log:
    enabled: false                      # 기본값: false (parent logger 사용)
    name: "log_xloto_image_text_recognize"   # 모듈별 로거 이름
    level: "DEBUG"                      # 로그 레벨
    sinks:
      - sink_type: "file"
        file_path: "{{cashop_test_dir}}/logs/log_xloto_image_text_recognize_{time:YYYY-MM-DD}.log"
        level: "DEBUG"
        format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
        rotation: "10 MB"
        retention: "7 days"
        compression: null
        enqueue: true
        serialize: false
        backtrace: true
        diagnose: true
        colorize: true
        catch: true
      - sink_type: "console"
        level: "INFO"
