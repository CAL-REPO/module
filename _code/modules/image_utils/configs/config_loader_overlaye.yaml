# ============================================================
# ConfigLoaderPolicy - src 포함 테스트
# ============================================================
source:
  # src에 YAML 파일 경로 지정 (정적 설정)
    - src: ["M:/CALife/CAShop - 구매대행/_code/modules/image_utils/configs/overlay.yaml", overlay]
      yaml_parser:
        safe_mode: true
        encoding: "utf-8"
        enable_env: true
        enable_include: true
        enable_placeholder: true
        enable_reference: true
      
      yaml_normalizer:
        normalize_keys: true
        drop_blanks: false
        resolve_vars: true
      
      yaml_merge:
        deep: true
        overwrite: true
      
      # BaseModel 정책
      base_model_normalizer:
        normalize_keys: true
        drop_blanks: false
        resolve_vars: false
      
      base_model_merge:
        deep: false
        overwrite: false
      
      # Dict 정책
      dict_normalizer:
        normalize_keys: true
        drop_blanks: true
        resolve_vars: false
      
      dict_merge:
        deep: false
        overwrite: true

keypath:
  separator: "__"
# --------------------------------------------------------------------------
# 5. Log - 로그 설정 (ImageOCR과 동일)
# --------------------------------------------------------------------------
log:
  enabled: false             # 로깅 활성화 여부
  name: base                 # 로거 이름
  level: INFO                # 로그 레벨
  sinks:                     # Sink 리스트
    - sink_type: console     # Console sink
      level: INFO
      format: "<green>{time:YYYY-MM-DD HH:mm:ss.SSS}</green> | <level>{level: <8}</level> | <level>{message}</level>"
      colorize: true
      enqueue: true
      backtrace: true
      diagnose: true
      catch: true
  context: {}                # 추가 컨텍스트