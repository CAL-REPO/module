# ============================================================================
# ImageTextRecognizer (EntryPoint) - Complete Configuration Example
# ============================================================================
# ImageTextRecognizer EntryPoint 전용 설정 파일
# source + ImageTextRecognize Adapter Policy를 포함합니다.
# translate_utils의 Translator 패턴과 동일한 구조입니다.

# --------------------------------------------------------------------------
# ImageTextRecognizer EntryPoint Policy
# --------------------------------------------------------------------------
image_text_recognizer:
  # --------------------------------------------------------------------------
  # 1. Source - 소스 이미지 설정
  # --------------------------------------------------------------------------
  source:
    path: "input/document.jpg"
    must_exist: false
    convert_mode: "RGB"
  
  # --------------------------------------------------------------------------
  # 2. Text Recognize - ImageTextRecognize Adapter 설정
  # --------------------------------------------------------------------------
  text_recognize:
    # Provider - OCR 제공자 설정
    provider:
      provider: "paddle"                  # OCR 제공자: paddle, tesseract 등
      langs: ["ch", "en"]                 # 언어 코드 목록
      min_conf: 0.5                       # 최소 신뢰도 (0.0-1.0)
      
      # PaddleOCR 전용 설정
      paddle_device: "cpu"                # 디바이스: cpu, gpu
      paddle_use_angle_cls: true          # 각도 분류 사용
      paddle_instance: null               # 캐시된 인스턴스 (내부 사용)
    
    # Preprocess - OCR 전처리 설정
    preprocess:
      max_width: null                     # OCR용 최대 너비 (리사이즈)
    
    # Postprocess - OCR 후처리 설정
    postprocess:
      strip_special_chars: true           # 특수문자 제거
      filter_alphanumeric: true           # 영숫자만 있는 텍스트 필터링
      deduplicate_iou_threshold: 0.7      # 중복 제거 IoU 임계값
      prefer_lang_order: ["ch", "en"]     # 언어 우선순위
    
    # Save - 이미지 저장 설정 (FSO 기반)
    save:
      save_copy: false                    # OCR 결과 이미지 저장 (보통 false)
      directory: "output/ocr"
      
      name:
        as_type: "file"
        prefix: null
        name: ""
        suffix: "_ocr"
        tail: null
        extension: null
        delimiter: "_"
        tail_mode: "counter"
        date_format: "%Y-%m-%d"
        counter_width: 3
        auto_expand: true
        tail_suffix: null
        sanitize: true
        case: "keep"
        ensure_unique: true
      
      ops:
        as_type: "file"
        exist:
          must_exist: false
          create_if_missing: true
          overwrite: false
        ext:
          require_ext: false
          default_ext: null
          allowed_exts: null
      
      format: null
      quality: 95
    
    # Meta - 메타데이터 저장 설정 (OCR 결과 포함)
    meta:
      save_meta: true                     # OCR 결과 JSON 저장
      directory: null
      
      name:
        as_type: "file"
        prefix: null
        name: ""
        suffix: "_ocr"                    # OCR 메타 접미사
        tail: null
        extension: ".json"
        delimiter: "_"
        tail_mode: null
        date_format: "%Y-%m-%d"
        counter_width: 3
        auto_expand: true
        tail_suffix: null
        sanitize: true
        case: "keep"
        ensure_unique: false
      
      ops:
        as_type: "file"
        exist:
          must_exist: false
          create_if_missing: true
          overwrite: true
        ext:
          require_ext: false
          default_ext: ".json"
          allowed_exts: null

    # Log - 로깅 설정 (Optional)
    log: null                             # EntryPoint에서 주입 가능
