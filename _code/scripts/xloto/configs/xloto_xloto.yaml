# ============================================================
# XLOTO Policy - Excel + OTO Pipeline Integration
# ============================================================
# 책임:
# 1. 이미지 경로 정책 (원본/번역 이미지)
# 2. 통합 로그 정책
#
# Note:
#   - Column 필터링은 xl_utils의 column_alias로 처리
#   - 필터 컬럼: cas, download, translation (PRODUCT_LIST preset 사용)

xloto:
  # 이미지 경로 정책
  paths:
    public_img_dir: "{{public_dir}}/01.IMAGE"    # 공용 이미지 디렉토리 (환경변수 해석)
    origin_dirname: original                      # 원본 이미지 폴더명
    translated_dirname: translated                # 번역 이미지 폴더명

  # 통합 로그 정책
  log:
    enabled: true
    name: xloto
    level: INFO
    sinks:
      - sink_type: console
        level: INFO
        format: "<green>{time:YYYY-MM-DD HH:mm:ss.SSS}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
        colorize: true
        enqueue: true
      
      - sink_type: file
        level: DEBUG
        file_path: "{{logs_dir}}/xloto/xloto_{time:YYYY-MM-DD}.log"
        rotation: "00:00"
        retention: "7 days"
        compression: zip
        encoding: utf-8
        enqueue: true
        format: "{time:YYYY-MM-DD HH:mm:ss.SSS} | {level: <8} | {name}:{function}:{line} - {message}"
    
    context: {}
