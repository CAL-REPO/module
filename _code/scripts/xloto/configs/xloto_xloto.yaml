# ============================================================
# XlOtoPolicy - XLOTO 파이프라인 정책
# ============================================================
# XLOTO 파이프라인 자체 정책 (로깅 + 경로)
# 서브 모듈 정책은 SectionExtractor가 동적 추출

# ============================================================
# Policy Name (SectionExtractor에서 사용)
# ============================================================
xloto:
  # ============================================================
  # Excel 설정 (파일/시트)
  # ============================================================
  excel:
    file_path: "{{scripts_dir}}/xloto/test/01.All Product List.xlsx"
    sheet:
      sheet_name: "Purchase"
      column_alias: "PRODUCT_LIST"
  
  # ============================================================
  # Paths Policy - 이미지 경로 정책
  # ============================================================
  paths:
    # 공용 이미지 디렉토리 (환경변수 참조)
    public_img_dir: "{{scripts_dir}}/xloto/test/images"
    # 원본 이미지 폴더명
    origin_dirname: "input"
    # 번역 이미지 폴더명
    translated_dirname: "output"

  # ============================================================
  # Log Policy - XLOTO 파이프라인 로깅 정책
  # ============================================================
  log:
    # 로깅 활성화
    enabled: false
    
    # Logger 이름
    name: "log_xloto_pipeline"
    
    # 로그 레벨 (DEBUG, INFO, WARNING, ERROR, CRITICAL)
    level: "INFO"
    
    # Sinks 설정
    sinks:
      # Console Sink
      - sink_type: "console"
        level: "INFO"
        format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan> - <level>{message}</level>"
        colorize: true
        enqueue: false
        catch: true
      
      # File Sink (Debug)
      - sink_type: "file"
        file_path: "{{logs_dir}}/xloto/xloto_pipeline_{time:YYYY-MM-DD}.log"
        level: "DEBUG"
        format: "<green>{time:YYYY-MM-DD HH:mm:ss.SSS}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
        rotation: "10 MB"
        retention: "30 days"
        compression: null
        enqueue: true
        serialize: false
        backtrace: true
        diagnose: true
        colorize: true
        catch: true
      
      # File Sink (Error Only)
      - sink_type: "file"
        file_path: "{{logs_dir}}/xloto/xloto_error_{time:YYYY-MM-DD}.log"
        level: "ERROR"
        format: "<red>{time:YYYY-MM-DD HH:mm:ss.SSS}</red> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>\n{exception}"
        rotation: "10 MB"
        retention: "90 days"
        compression: "zip"
        enqueue: true
        serialize: false
        backtrace: true
        diagnose: true
        colorize: true
        catch: true
    
    # Context (추가 로그 컨텍스트)
    context:
      pipeline: "xloto"
      version: "1.0.0"

# ============================================================
# 서브 모듈 정책 (SectionExtractor가 동적 추출)
# ============================================================
# ⚠️ 서브 모듈 정책은 여기에 정의하지 않음
# 
# ConfigLoader가 다음 섹션들을 병합:
# - excel: xloto_excel.yaml
# - image_load: xloto_image_load.yaml
# - image_text_recognize: xloto_image_text_recognize.yaml
# - translate: xloto_translate.yaml
# - image_overlay: xloto_image_overlay.yaml
# 
# XlOto Adapter가 SectionExtractor로 각 섹션 추출:
# - Excel: SectionExtractor.extract(merged_config, ExcelLoadPolicy)
# - OTO 모듈들: Oto Adapter 내부에서 자동 추출
# ============================================================
