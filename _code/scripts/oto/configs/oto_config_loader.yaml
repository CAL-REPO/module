# ============================================================
# ConfigLoaderPolicy - OTO Configuration
# ============================================================
# OTO Adapter용 설정 로더
# scripts/oto/configs 폴더의 YAML 파일들을 병합하여 OTOPolicy 생성

source:
  # image_text_recognize 섹션 (Adapter Policy 섹션명)
  - src: ["{{scripts_oto_dir}}/configs/oto_image_load.yaml", "image_load"]
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: true
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: true
    yaml_merge:
      deep: true
      overwrite: true

  # image_text_recognize 섹션 (Adapter Policy 섹션명)
  - src: ["{{scripts_oto_dir}}/configs/oto_image_text_recognize.yaml", "image_text_recognize"]
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: true
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: true
    yaml_merge:
      deep: true
      overwrite: true

  # translate 섹션 (Adapter Policy 섹션명)
  - src: ["{{scripts_oto_dir}}/configs/oto_translate.yaml", "translate"]
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: true
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: true
    yaml_merge:
      deep: true
      overwrite: true

  # image_overlay 섹션 (Adapter Policy 섹션명)
  - src: ["{{scripts_oto_dir}}/configs/oto_image_overlay.yaml", "image_overlay"]
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: true
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: true
    yaml_merge:
      deep: true
      overwrite: true

keypath:
separator: "__"

log:
  enabled: true
  name: "log_oto_cfg_loader"
  level: "INFO"
  sinks:
    - sink_type: "file"
      file_path: "{{scripts_oto_dir}}/test/logs/oto_config_loader_{time:YYYY-MM-DD}.log"
      level: "DEBUG"
      format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
      rotation: "10 MB"
      retention: "7 days"
      compression: null
      enqueue: true
      serialize: false
      backtrace: true
      diagnose: true
      colorize: true
      catch: true
  context: {}

