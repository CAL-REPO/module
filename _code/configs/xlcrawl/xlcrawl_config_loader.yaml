# ============================================================
# ConfigLoaderPolicy - XLOTO Pipeline Configuration
# ============================================================
source:
  # OTO - Image (ImageLoad Adapter Policy)
  - src: ["{{configs_xlcrawl_dir}}/xlcrawl_excel.yaml", "xlcrawl_excel"]
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: true              # ✅ 환경변수 resolving 활성화
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: true
    
    yaml_merge:
      deep: true
      overwrite: true

  # OTO - Text Recognize (OCR Adapter Policy)
  - src: ["{{configs_oto_dir}}/text_recognize.yaml", "text_recognize"]
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: true              # ✅ 환경변수 resolving 활성화
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: true
    
    yaml_merge:
      deep: true
      overwrite: true

log:
  enabled: true
  name: "log_xlcrawl_config_loader"
  level: "INFO"
  sinks:
    - sink_type: "file"
      file_path: "${logs_dir}/xlcrawl/_{time:YYYY-MM-DD}.log"
      level: "INFO"
      format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
      rotation: Optional[Union[str, int]] = "10 MB"
      retention: Optional[Union[str, int]] = "7 days"
      compression: Optional[str] = None
      enqueue: bool = True
      serialize: bool = False
      backtrace: bool = True
      diagnose: bool = True
      colorize: bool = True
      catch: bool = True
  context: {}

