# -*- coding: utf-8 -*-
# XlCrawl Crawl 테스트 설정
# 역할: xlcrawl 프로젝트 통합 테스트 (Crawl preset mapping)

xlcrawl_crawl:
  preset_mapping:
    rules:
      # AliExpress - Detail
      - domain_pattern: "aliexpress\\.com"
        site: "aliexpress"
        method: "detail"
        crawl_config: "modules/crawl_utils/configs/crawl_site_aliexpress_detail.yaml"
        webdriver_config: "modules/crawl_utils/configs/firefox_aliexpress.yaml"
      
      # AliExpress - Search
      - domain_pattern: "aliexpress\\.com.*s=.*"
        site: "aliexpress"
        method: "search"
        crawl_config: "modules/crawl_utils/configs/crawl_site_aliexpress_search.yaml"
        webdriver_config: "modules/crawl_utils/configs/firefox_aliexpress.yaml"
      
      # Taobao - Detail
      - domain_pattern: "taobao\\.com"
        site: "taobao"
        method: "detail"
        crawl_config: "modules/crawl_utils/configs/crawl_site_taobao_detail.yaml"
        webdriver_config: "modules/crawl_utils/configs/firefox_taobao.yaml"
      
      # Taobao - Search
      - domain_pattern: "taobao\\.com.*search"
        site: "taobao"
        method: "search"
        crawl_config: "modules/crawl_utils/configs/crawl_site_taobao_search.yaml"
        webdriver_config: "modules/crawl_utils/configs/firefox_taobao.yaml"

log:
  enabled: true
  name: "log_xlcrawl_crawl_test"
  level: "DEBUG"
  sinks:
    - sink_type: "file"
      file_path: "{{logs_dir}}/xlcrawl_crawl_test/_{time:YYYY-MM-DD}.log"
      level: "DEBUG"
      format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
      rotation: "10 MB"
      retention: "3 days"
      enqueue: true
      backtrace: true
      diagnose: true
      colorize: true
      catch: true
  context:
    test_mode: true
