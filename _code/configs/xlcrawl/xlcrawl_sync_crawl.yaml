# -*- coding: utf-8 -*-
# XlCrawl SyncCrawl v5.1 설정
# 역할: sync_crawl.py에서 사용하는 모든 계층화된 정책 정의

# ========================================
# CrawlPolicy - 통합 크롤링 정책
# ========================================
crawl:
  # 기본 정보
  site: "aliexpress"
  method: "detail"
  preset: "aliexpress_detail"
  
  # ----------------------------------------
  # ExecutionPolicy - 실행 모드 및 동시성
  # ----------------------------------------
  execution:
    mode: "sync"
    concurrency: 1
  
  # ----------------------------------------
  # RetryPolicy - 재시도 정책
  # ----------------------------------------
  retry:
    retries: 3
    backoff_sec: 2.0
  
  # ----------------------------------------
  # NavigationPolicy - 페이지 로드 정책
  # ----------------------------------------
  navigation:
    base_url: null  # run()에서 URL 전달
    load_timeout_sec: 30
    page_load_strategy: "normal"
    wait_after_load_sec: 2.0
  
  # ----------------------------------------
  # ScrollPolicy - 스크롤 정책 (선택적)
  # ----------------------------------------
  scroll:
    strategy: "smooth"
    max_scrolls: 5
    scroll_pause_sec: 1.0
    scroll_amount: 500
  
  # ----------------------------------------
  # WaitPolicy - 대기 정책 (선택적)
  # ----------------------------------------
  wait:
    hook: "css"
    selector: ".product-title"
    timeout_sec: 10
    condition: "presence"
  
  # ----------------------------------------
  # ExtractorPolicy - 데이터 추출 정책
  # ----------------------------------------
  extractor:
    js_snippet: |
      return {
        title: document.querySelector('.product-title')?.innerText || '',
        price: document.querySelector('.product-price')?.innerText || '',
        images: Array.from(document.querySelectorAll('.product-image img')).map(img => img.src)
      };
  
  # ----------------------------------------
  # NormalizationRule - Extract → Save 규칙
  # ----------------------------------------
  rules:
    # Rule 1: 상품 이미지 저장
    - source: "images[]"
      auto_infer: false
      directory: "{{public_dir}}/01.IMAGE/{{cas_no}}"
      name: "{{cas_no}}_{{_index:02d}}.jpg"
      ops:
        - type: "ensure_parent"
    
    # Rule 2: 상품 정보 JSON 저장
    - source: null
      auto_infer: true
      directory: "{{public_dir}}/01.IMAGE/{{cas_no}}"
      name: "{{cas_no}}_info.json"
      ops:
        - type: "ensure_parent"
  
  # ----------------------------------------
  # PostProcessorPolicy - 파일 저장 정책
  # ----------------------------------------
  post_processor:
    runtime_context:
      cas_no: "CAPEA-001"
      site: "aliexpress"
      method: "detail"
    env_context:
      public_dir: "{{public_dir}}"
      logs_dir: "{{logs_dir}}"

  # ========================================
  # LogPolicy - 로깅 설정
  # ========================================
  log:
    enabled: true
    name: "log_sync_crawl"
    level: "INFO"
    sinks:
      - sink_type: "file"
        file_path: "{{logs_dir}}/sync_crawl/_{time:YYYY-MM-DD}.log"
        level: "DEBUG"
        format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
        rotation: "10 MB"
        retention: "7 days"
        enqueue: true
        backtrace: true
        diagnose: true
        colorize: true
        catch: true
      
      - sink_type: "console"
        level: "INFO"
        format: "<green>{time:HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan> - <level>{message}</level>"
        colorize: true
        catch: true
    
    context:
      project: "xlcrawl"
      module: "sync_crawl"
