# ============================================================================
# ImageLoader - XLOTO Configuration
# ============================================================================
# XLOTO 파이프라인에서 사용하는 ImageLoader EntryPoint 설정
# 필수 항목만 활성화, 고급 옵션은 주석 처리

xloto_image_loader:
  # --------------------------------------------------------------------------
  # 1. Source - 소스 이미지 설정 (런타임에서 지정)
  # --------------------------------------------------------------------------
  source:
    # path: "{{configs_xlcrawl_product_detail_base_dir}}"           # 소스 이미지 경로 (런타임 오버라이드)
    must_exist: true                 # 파일 존재 여부 확인
    convert_mode: "RGB"               # PIL 모드 변환
  
  # --------------------------------------------------------------------------
  # 2. Image - ImageLoad Adapter 설정
  # --------------------------------------------------------------------------
  image:
    # Save - 이미지 저장 설정
    save:
      save_copy: false                    # 이미지 복사본 저장 여부 (임시로 비활성화)
      # directory: "{{temp_input_dir}}"      # 저장 디렉토리
      
      # FSO Name Policy - 파일 이름 생성 정책
      name:
        # as_type: "file"
        # prefix: null
        # name: ""
        suffix: "copy"              # 파일명 접미사
        # tail: null
        # extension: null
        
        # Tail 자동 생성 옵션
        delimiter: "_"
        tail_mode: "datetime_counter"         # ensure_unique와 함께 사용
        date_format: "%Y-%m-%d"
        counter_width: 2
        # auto_expand: true
        # tail_suffix: null
        # sanitize: true
        # case: "keep"
        # ensure_unique: true
      # ops:
      #   as_type: "file"
      #   exist:
      #     must_exist: false
      #     create_if_missing: true
      #     overwrite: false
        # ext:
        #   require_ext: true
        #   default_ext: null
        #   allowed_exts: null
      
      # 이미지 포맷 설정
      # format: null
      quality: 95                         # JPEG/WebP 품질
    
    # Meta - 메타데이터 저장 설정
    meta:
      save_meta: true                    # 메타 저장 활성화
      directory: "{{configs_xlcrawl_product_detail_base_dir}}"      # 메타 저장 디렉토리
      name:
      #   as_type: "file"
      #   prefix: null
      #   name: ""
        suffix: "_meta"
      #   tail: null
      #   extension: ".json"
        delimiter: "_"
        tail_mode: "datetime_counter"
        date_format: "%Y-%m-%d"
        counter_width: 2
      #   auto_expand: true
      #   tail_suffix: null
      #   sanitize: true
      #   case: "keep"
      #   ensure_unique: false
      ops:
        as_type: "file"
        exist:
          must_exist: false
          create_if_missing: true
          overwrite: true
        # ext:
        #   require_ext: true
        #   default_ext: ".json"
        #   allowed_exts: null
    
    # Process - 이미지 처리 설정
    process:
      resize_to: null
      blur_radius: null
      convert_mode: null
    
    # Log - ImageLoad Adapter 전용 로그 (Dual Logging - Secondary)
    log:
      enabled: true
      name: "xloto_image_loader_adapter"
      level: "DEBUG"
      sinks:
        - sink_type: "file"
          file_path: "{{logs_dir}}/xloto_image_loader_adapter_{time:YYYY-MM-DD}.log"
          level: "DEBUG"
          format: "<green>{time:HH:mm:ss.SSS}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
          rotation: "10 MB"
          retention: "7 days"
          enqueue: true
  
  # --------------------------------------------------------------------------
  # 3. Log - EntryPoint 통합 로그 (Dual Logging - Primary)
  # --------------------------------------------------------------------------
  log:
    enabled: true
    name: "xloto_image_loader"
    level: "INFO"
    sinks:
      - sink_type: "file"
        file_path: "{{logs_dir}}/xloto_image_loader_{time:YYYY-MM-DD}.log"
        level: "INFO"
        format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
        rotation: "10 MB"
        retention: "7 days"
        enqueue: true
      - sink_type: "console"
        level: "INFO"
        colorize: true