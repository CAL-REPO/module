# ============================================================================
# ImageTextRecognizer - XLOTO Pipeline Configuration
# ============================================================================
# XLOTO 파이프라인에서 사용하는 ImageTextRecognizer 설정 (EntryPoint)
xloto_image_text_recognizer:
  # --------------------------------------------------------------------------
  # 1. Source - 소스 이미지 설정 (런타임에서 Image 객체 전달)
  # --------------------------------------------------------------------------
  source:
    # path: "{{temp_input_dir}}/01.jpg"          # 기본값 (런타임 오버라이드)
    # must_exist: false
    # convert_mode: "RGB"
  
  # --------------------------------------------------------------------------
  # 2. text_recognize - ImageTextRecognize Adapter Policy
  # --------------------------------------------------------------------------
  text_recognize:
    # Provider - OCR 제공자 설정
    provider:
      provider: "paddle"                  # OCR 제공자: paddle, tesseract
      langs: ["ch", "en"]                 # 언어 코드 목록
      min_conf: 0.5                       # 최소 신뢰도 (0.0-1.0)
      
      # PaddleOCR 전용 설정
      paddle_device: "gpu"
      paddle_use_angle_cls: true
      paddle_use_doc_orientation_classify: false  # 🔧 문서 방향 감지 비활성화
      paddle_use_doc_unwarping: false             # 🔧 문서 왜곡 보정 비활성화
      # paddle_instance: null
    
    # Preprocess - OCR 전처리 설정
    preprocess:
      max_width: 2000                     # 최대 너비 (이보다 크면 resize)
    
    # Postprocess - OCR 후처리 설정
    postprocess:
      strip_special_chars: true           # 특수문자 제거
      filter_alphanumeric: true           # 영숫자만 있는 텍스트 필터링
      deduplicate_iou_threshold: 0.7      # 중복 제거 IoU 임계값
      prefer_lang_order: ["ch", "en"]     # 언어 우선순위
    
    # Save - 이미지 저장 설정
    save:
      save_copy: false                   # OCR 결과 이미지 저장 활성화
      # directory: "{{configs_xloto_product_detail_base_dir}}"      # 저장 디렉토리
      name:
      #   as_type: "file"
      #   prefix: null
      #   name: ""
        suffix: "ocr_copy"
      #   tail: null
      #   extension: null
      #   delimiter: "_"
        tail_mode: "counter"
      #   date_format: "%Y-%m-%d"
      #   counter_width: 3
      #   auto_expand: true
      #   tail_suffix: null
      #   sanitize: true
      #   case: "keep"
      #   ensure_unique: true
      # ops:
      #   as_type: "file"
      #   exist:
      #     must_exist: false
      #     create_if_missing: true
      #     overwrite: false
      #   ext:
      #     require_ext: false
      #     default_ext: null
      #     allowed_exts: null
      # format: null
      # quality: 95
    
    # Meta - 메타데이터 저장 설정
    meta:
      save_meta: false                     # OCR 메타 저장 활성화
      directory: "{{configs_xloto_product_detail_base_dir}}"      # 메타 저장 디렉토리
      name:
      #   as_type: "file"
      #   prefix: null
      #   name: ""
        suffix: "ocr_meta"
        # tail: null
      #   extension: ".json"
      #   delimiter: "_"
        tail_mode: "counter"
      #   date_format: "%Y-%m-%d"
      #   counter_width: 3
      #   auto_expand: true
        # tail_suffix: null
      #   sanitize: true
      #   case: "keep"
      #   ensure_unique: false
      # ops:
      #   as_type: "file"
      #   exist:
      #     must_exist: false
      #     create_if_missing: true
      #     overwrite: true
      #   ext:
      #     require_ext: false
      #     default_ext: ".json"
      #     allowed_exts: null
    
    # Log - ImageTextRecognize Adapter 전용 로그 (Dual Logging - Secondary)
    log:
      enabled: true
      name: "xloto_image_text_recognizer_adapter"
      level: "DEBUG"
      sinks:
        - sink_type: "file"
          file_path: "{{logs_dir}}/xloto_image_text_recognizer_adapter_{time:YYYY-MM-DD}.log"
          level: "DEBUG"
          format: "<green>{time:HH:mm:ss.SSS}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
          rotation: "10 MB"
          retention: "7 days"
          enqueue: true
  
  # --------------------------------------------------------------------------
  # 3. Log - EntryPoint 통합 로그 (Dual Logging - Primary)
  # --------------------------------------------------------------------------
  log:
    enabled: true
    name: "xloto_image_text_recognizer"
    level: "INFO"
    sinks:
      - sink_type: "file"
        file_path: "{{logs_dir}}/xloto_image_text_recognizer_{time:YYYY-MM-DD}.log"
        level: "INFO"
        format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
        rotation: "10 MB"
        retention: "7 days"
        enqueue: true
      - sink_type: "console"
        level: "INFO"
        colorize: true
