# ============================================================
# ConfigLoaderPolicy - XLOTO Pipeline Configuration
# ============================================================
xloto_cfg_loader:

  source:
    # Excel 설정
    - src: ["{{configs_xloto_dir}}/excel.yaml", "excel"]
      yaml_parser:
        safe_mode: true
        encoding: "utf-8"
        enable_env: true              # ✅ 환경변수 resolving 활성화
        enable_include: true
        enable_placeholder: true
        enable_reference: true
      
      yaml_normalizer:
        normalize_keys: true
        drop_blanks: true
        resolve_vars: true
      
      yaml_merge:
        deep: true
        overwrite: true

    # OTO - Image (ImageLoad Adapter Policy)
    - src: ["{{configs_xloto_dir}}/image.yaml", "image_load"]
      yaml_parser:
        safe_mode: true
        encoding: "utf-8"
        enable_env: true              # ✅ 환경변수 resolving 활성화
        enable_include: true
        enable_placeholder: true
        enable_reference: true
      
      yaml_normalizer:
        normalize_keys: true
        drop_blanks: true
        resolve_vars: true
      
      yaml_merge:
        deep: true
        overwrite: true

    # OTO - Text Recognize (OCR Adapter Policy)
    - src: ["{{configs_xloto_dir}}/text_recognize.yaml", "text_recognize"]
      yaml_parser:
        safe_mode: true
        encoding: "utf-8"
        enable_env: true              # ✅ 환경변수 resolving 활성화
        enable_include: true
        enable_placeholder: true
        enable_reference: true
      
      yaml_normalizer:
        normalize_keys: true
        drop_blanks: true
        resolve_vars: true
      
      yaml_merge:
        deep: true
        overwrite: true

    # OTO - Translate (Translate Adapter Policy)
    - src: ["{{configs_xloto_dir}}/translate.yaml", "translate"]
      yaml_parser:
        safe_mode: true
        encoding: "utf-8"
        enable_env: true              # ✅ 환경변수 resolving 활성화
        enable_include: true
        enable_placeholder: true
        enable_reference: true
      
      yaml_normalizer:
        normalize_keys: true
        drop_blanks: true
        resolve_vars: true
      
      yaml_merge:
        deep: true
        overwrite: true

    # OTO - Overlay (Overlay Adapter Policy)
    - src: ["{{configs_xloto_dir}}/overlay.yaml", "overlay"]
      yaml_parser:
        safe_mode: true
        encoding: "utf-8"
        enable_env: true              # ✅ 환경변수 resolving 활성화
        enable_include: true
        enable_placeholder: true
        enable_reference: true
      
      yaml_normalizer:
        normalize_keys: true
        drop_blanks: true
        resolve_vars: true
      
      yaml_merge:
        deep: true
        overwrite: true

keypath:
  separator: "__"

log:
  enabled: true
  name: "log_xloto_cfg_loader"
  level: "INFO"
  sinks:
    - sink_type: "file"
      file_path: "${logs_dir}/xloto_cfg_loader/_{time:YYYY-MM-DD}.log"
      level: "INFO"
      format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
      rotation: Optional[Union[str, int]] = "10 MB"
      retention: Optional[Union[str, int]] = "7 days"
      compression: Optional[str] = None
      enqueue: bool = True
      serialize: bool = False
      backtrace: bool = True
      diagnose: bool = True
      colorize: bool = True
      catch: bool = True
  context: {}

