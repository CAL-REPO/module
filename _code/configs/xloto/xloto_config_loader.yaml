# ============================================================
# ConfigLoader for XLOTO Pipeline
# ============================================================

source:
  # 1. XlOtoPolicy 설정 (Filter/Paths/Log 정책)
  - src: ["{{configs_xloto_dir}}/xloto.yaml", "xloto"]
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: true
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: true
    yaml_merge:
      deep: true
      overwrite: true

  # 2. ExcelLoader EntryPoint 설정
  - src: ["{{configs_xloto_dir}}/xloto_excel_loader.yaml", "xloto_excel_loader"]
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: true
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: true
    yaml_merge:
      deep: true
      overwrite: true

  # 3. ImageLoader EntryPoint 설정
  - src: ["{{configs_xloto_dir}}/xloto_image_loader.yaml", "xloto_image_loader"]
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: true
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: true
    yaml_merge:
      deep: true
      overwrite: true

  # 4. ImageTextRecognizer EntryPoint 설정
  - src: ["{{configs_xloto_dir}}/xloto_image_text_recognizer.yaml", "xloto_image_text_recognizer"]
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: true
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: true
    yaml_merge:
      deep: true
      overwrite: true

  # 5. Translate EntryPoint 설정
  - src: ["{{configs_xloto_dir}}/xloto_translate.yaml", "xloto_translate"]
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: true
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: true
    yaml_merge:
      deep: true
      overwrite: true

  # 6. ImageOverlayer EntryPoint 설정
  - src: ["{{configs_xloto_dir}}/xloto_image_overlayer.yaml", "xloto_image_overlayer"]
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: true
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: true
    yaml_merge:
      deep: true
      overwrite: true

keypath:
  separator: "__"

log:
  enabled: false
  name: xloto_cfg_loader
  level: INFO
  sinks:
    - sink_type: console
      level: INFO
      format: "<green>{time:YYYY-MM-DD HH:mm:ss.SSS}</green> | <level>{level: <8}</level> | <level>{message}</level>"
      colorize: true
      enqueue: true
  context: {}
