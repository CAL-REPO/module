# ============================================================================
# Translation Configuration - OTO
# ============================================================================
# OTO 파이프라인에서 사용하는 Translate Adapter 설정
# 필수 항목만 활성화, 고급 옵션은 주석 처리

xloto_translate:
  # --------------------------------------------------------------------------
  # 1. Source - 번역할 텍스트 (런타임에서 지정)
  # --------------------------------------------------------------------------
  # source:
    # text: ["正在努力"]                            # 런타임에서 OCR 결과 전달
    # file_path: ""

  # --------------------------------------------------------------------------
  # 2. Provider - 번역 API 설정
  # --------------------------------------------------------------------------
  provider:
    provider: "deepL"                    # Provider: "deepl" | "google" | "mock"
    source_lang: "AUTO"
    target_lang: "KO"                   # 목표 언어
    model_type: "prefer_quality_optimized"
    timeout: 30

  # --------------------------------------------------------------------------
  # 3. Chinese Text Preprocessing
  # --------------------------------------------------------------------------
  zh:
    mode: "clause"                      # Chunking: "off" | "clause"
    max_len: 80
    min_len: 40
    # phrase_map: []

  # --------------------------------------------------------------------------
  # 4. Storage - 번역 캐시 저장
  # --------------------------------------------------------------------------
  store:
    save_db: true                       # SQLite 캐시 사용
    db_dir: "{{db_dir}}"         # DB 저장 디렉토리
    db_name: "translate_cache.sqlite3"
    save_tr: true                       # JSON 저장 활성화
    tr_dir: "{{configs_xloto_product_detail_base_dir}}"         # JSON 저장 디렉토리
    tr_name: "translated_text.json"

  # --------------------------------------------------------------------------
  # 5. Log - Translate Adapter 로그 (Dual Logging - Secondary)
  # --------------------------------------------------------------------------
  log:
    enabled: true
    name: "xloto_translate_adapter"
    level: "DEBUG"
    sinks:
      - sink_type: "file"
        file_path: "{{logs_dir}}/xloto/xloto_translate_adapter_{time:YYYY-MM-DD}.log"
        level: "DEBUG"
        format: "<green>{time:HH:mm:ss.SSS}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
        rotation: "10 MB"
        retention: "7 days"
        enqueue: true
