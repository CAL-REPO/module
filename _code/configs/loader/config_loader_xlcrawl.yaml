# ============================================================
# ConfigLoaderPolicy - XlCrawl Pipeline Configuration
# ============================================================
xlcrawl_cfg_loader:

  source:
    # Excel 설정
    - src: ["{{configs_xlcrawl_dir}}/xlcrawl_excel.yaml", "excel"]
      yaml_parser:
        safe_mode: true
        encoding: "utf-8"
        enable_env: true              # ✅ 환경변수 resolving 활성화
        enable_include: true
        enable_placeholder: true
        enable_reference: true
      
      yaml_normalizer:
        normalize_keys: true
        drop_blanks: true
        resolve_vars: true
      
      yaml_merge:
        deep: true
        overwrite: true

    # Crawl Preset Mapping
    - src: ["{{configs_xlcrawl_dir}}/xlcrawl_crawl.yaml", "crawl"]
      yaml_parser:
        safe_mode: true
        encoding: "utf-8"
        enable_env: true              # ✅ 환경변수 resolving 활성화
        enable_include: true
        enable_placeholder: true
        enable_reference: true
      
      yaml_normalizer:
        normalize_keys: true
        drop_blanks: true
        resolve_vars: true
      
      yaml_merge:
        deep: true
        overwrite: true

keypath:
  separator: "__"

log:
  enabled: false
  name: "xlcrawl_cfg_loader"
  level: "INFO"
  sinks:
    - sink_type: "console"
      level: "INFO"
      format: "<green>{time:YYYY-MM-DD HH:mm:ss.SSS}</green> | <level>{level: <8}</level> | <level>{message}</level>"
      colorize: true
      enqueue: true
      backtrace: true
      diagnose: true
      catch: true
  context: {}
