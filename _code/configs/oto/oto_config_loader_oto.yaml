# ============================================================
# ConfigLoaderPolicy - src 포함 테스트
# ============================================================
source:
  # src에 YAML 파일 경로 지정 (정적 설정)
  - src: ["{{configs_oto_dir}}/image.yaml", "image"]
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: false
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: true
    
    yaml_merge:
      deep: true
      overwrite: true

  - src: ["{{configs_oto_dir}}/overlay.yaml", "overlay"]
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: false
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: true
    
    yaml_merge:
      deep: true
      overwrite: true

  - src: ["{{configs_oto_dir}}/text_recognize.yaml", "text_recognizer"]
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: false
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: true
    
    yaml_merge:
      deep: true
      overwrite: true

  - src: ["{{configs_oto_dir}}/translate.yaml", "translate"]
    yaml_parser:
      safe_mode: true
      encoding: "utf-8"
      enable_env: false
      enable_include: true
      enable_placeholder: true
      enable_reference: true
    
    yaml_normalizer:
      normalize_keys: true
      drop_blanks: true
      resolve_vars: true

keypath:
  separator: "__"

log:
  enabled: true
  name: "log_oto_cfg_loader"
  level: "INFO"
  sinks:
    - sink_type: "file"
      file_path: "${logs_dir}/oto/_{time:YYYY-MM-DD}.log"
      level: "INFO"
      format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
      rotation: Optional[Union[str, int]] = "10 MB"
      retention: Optional[Union[str, int]] = "7 days"
      compression: Optional[str] = None
      enqueue: bool = True
      serialize: bool = False
      backtrace: bool = True
      diagnose: bool = True
      colorize: bool = True
      catch: bool = True
  context: {}

