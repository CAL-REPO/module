# XLOTO Pipeline Configuration
# Excel + OTO 통합 처리 설정

name: "xloto"

# DataFrame 필터링 설정
filter:
  cas_column: "cas"
  download_column: "download"
  translation_column: "translation"

# 이미지 경로 설정
paths:
  public_img_dir: "M:/CALife/CAShop - 구매대행/_public/01.IMAGE"
  origin_dirname: "original"
  translated_dirname: "translated"

# 로그 설정
log:
  enabled: true
  level: "INFO"
  format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <level>{message}</level>"
  colorize: true
  diagnose: true
